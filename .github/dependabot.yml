version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  ignore:
  - dependency-name: y18n
    versions:
    - 3.2.2
  - dependency-name: workbox-core
    versions:
    - 6.0.2
    - 6.1.0
    - 6.1.1
    - 6.1.2
  - dependency-name: elliptic
    versions:
    - 6.5.4
  - dependency-name: "@polymer/polymer"
    versions:
    - 3.4.1
  - dependency-name: sinon
    versions:
    - 9.2.4
  - dependency-name: marked
    versions:
    - 2.0.0
  - dependency-name: "@fullcalendar/daygrid"
    versions:
    - 5.5.0
  - dependency-name: "@fullcalendar/interaction"
    versions:
    - 5.5.0
  - dependency-name: ini
    versions:
    - 1.3.8
  - dependency-name: lint-staged
    versions:
    - 10.5.3
  - dependency-name: lodash
    versions:
    - 4.17.20
  - dependency-name: "@types/hls.js"
    versions:
    - 0.13.3
  - dependency-name: raw-loader
    versions:
    - 4.0.2
